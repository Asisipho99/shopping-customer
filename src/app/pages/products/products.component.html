<!-- Header -->
<div class="page-header">
  <div class="container">
    <h2 class="mb-1">All Products</h2>
    <p class="mb-0">
      <span *ngIf="!loading">{{ filteredProducts.length }} products found</span>
      <span *ngIf="loading">Loading...</span>
    </p>
  </div>
</div>

<div class="container pb-5">
  <div class="row g-4">

    <!-- Sidebar -->
    <div class="col-lg-3">
      <div class="filter-card">
        <div class="filter-title"><i class="bi bi-sliders me-2"></i>Filters</div>

        <!-- Search -->
        <div class="mb-4">
          <label class="form-label" style="font-size:.8rem;font-weight:600;color:#374151;">Search</label>
          <div class="position-relative">
            <i class="bi bi-search position-absolute" style="left:10px;top:50%;transform:translateY(-50%);color:#9ca3af;font-size:.85rem;"></i>
            <input type="text" class="form-control ps-4"
                   style="font-size:.875rem;"
                   placeholder="Search products..."
                   [(ngModel)]="searchTerm" (input)="filter()">
          </div>
        </div>

        <!-- Category -->
        <div class="mb-4">
          <label class="form-label" style="font-size:.8rem;font-weight:600;color:#374151;">Category</label>
          <div class="d-flex flex-column gap-1">
            <label class="d-flex align-items-center gap-2 p-2 rounded cursor-pointer"
                   style="cursor:pointer;transition:background .15s;"
                   [style.background]="selectedCategory === '' ? '#e0e7ff' : 'transparent'">
              <input class="form-check-input m-0" type="radio"
                     value="" [(ngModel)]="selectedCategory" (change)="filter()">
              <span style="font-size:.85rem;font-weight:500;" [style.color]="selectedCategory === '' ? '#6366f1' : '#374151'">All Categories</span>
            </label>
            <label *ngFor="let cat of categories"
                   class="d-flex align-items-center gap-2 p-2 rounded"
                   style="cursor:pointer;transition:background .15s;"
                   [style.background]="selectedCategory === cat ? '#e0e7ff' : 'transparent'">
              <input class="form-check-input m-0" type="radio"
                     [value]="cat" [(ngModel)]="selectedCategory"
                     (change)="filter()" [id]="cat">
              <span style="font-size:.85rem;font-weight:500;" [style.color]="selectedCategory === cat ? '#6366f1' : '#374151'">{{ cat }}</span>
            </label>
          </div>
        </div>

        <button class="btn btn-sm w-100"
                style="border:1.5px solid #e5e7eb;border-radius:8px;font-size:.8rem;font-weight:600;color:#6b7280;"
                (click)="searchTerm=''; selectedCategory=''; filter()">
          <i class="bi bi-x-circle me-1"></i>Clear Filters
        </button>
      </div>
    </div>

    <!-- Grid -->
    <div class="col-lg-9">

      <div *ngIf="loading" class="text-center py-5">
        <div class="spinner-border" style="width:2.5rem;height:2.5rem;"></div>
        <p class="text-muted mt-3">Loading products...</p>
      </div>

      <div class="row g-3" *ngIf="!loading">

        <div class="col-6 col-md-4" *ngFor="let product of filteredProducts">
          <div class="card product-card h-100 border-0">
            <div class="product-img-wrapper">
              <img [src]="product.imageUrl || 'assets/no-image.png'"
                   [alt]="product.name" class="product-img">
              <div class="product-overlay"></div>
              <span class="cat-pill">{{ product.category }}</span>
            </div>
            <div class="card-body d-flex flex-column p-3">
              <h6 class="fw-bold mb-1" style="font-size:.88rem;line-height:1.3;">{{ product.name }}</h6>
              <p class="text-muted flex-grow-1 mb-2" style="font-size:.77rem;line-height:1.4;">
                {{ product.description | slice:0:60 }}...
              </p>
              <div class="fw-800 mb-3" style="font-size:1.05rem;font-weight:800;color:#6366f1;">
                R{{ product.price | number:'1.2-2' }}
              </div>
              <div class="d-flex gap-2">
                <button class="btn btn-primary btn-sm flex-grow-1"
                        style="font-size:.8rem;"
                        (click)="addToCart(product)">
                  <i class="bi me-1"
                     [class.bi-check-lg]="addedProductId === product.productId"
                     [class.bi-bag-plus]="addedProductId !== product.productId"></i>
                  {{ addedProductId === product.productId ? 'Added!' : 'Add to Cart' }}
                </button>
                <a [routerLink]="['/products', product.productId]"
                   class="btn btn-sm"
                   style="border:1.5px solid #e5e7eb;border-radius:8px;color:#6b7280;">
                  <i class="bi bi-eye"></i>
                </a>
              </div>
            </div>
          </div>
        </div>

        <!-- Empty -->
        <div class="col-12 text-center py-5" *ngIf="filteredProducts.length === 0">
          <div style="width:80px;height:80px;background:#f3f4f6;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;">
            <i class="bi bi-search" style="font-size:2rem;color:#9ca3af;"></i>
          </div>
          <h5 class="fw-bold text-muted">No products found</h5>
          <p class="text-muted" style="font-size:.875rem;">Try adjusting your search or filters</p>
          <button class="btn btn-outline-primary btn-sm px-4"
                  (click)="searchTerm=''; selectedCategory=''; filter()">
            Clear Filters
          </button>
        </div>

      </div>
    </div>

  </div>
</div>
