<div class="auth-page">
  <div class="auth-card">

    <div class="auth-logo">
      <i class="bi bi-key-fill"></i>
    </div>

    <div class="text-center mb-4">
      <h2 class="mb-1" style="font-size:1.5rem;">Forgot your password?</h2>
      <p class="text-muted mb-0" style="font-size:.875rem;">
        Enter your email and we'll send you a reset link
      </p>
    </div>

    @if (success()) {
      <div class="alert p-3 mb-3"
           style="background:#f0fdf4;border:1px solid #bbf7d0;border-radius:10px;color:#065f46;font-size:.85rem;">
        <i class="bi bi-check-circle me-2"></i>{{ success() }}
      </div>
    }

    @if (error()) {
      <div class="alert p-3 mb-3"
           style="background:#fef2f2;border:1px solid #fecaca;border-radius:10px;color:#991b1b;font-size:.85rem;">
        <i class="bi bi-exclamation-circle me-2"></i>{{ error() }}
      </div>
    }

    @if (!success()) {
      <div class="mb-4">
        <label class="form-label">Email address</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-envelope"></i></span>
          <input type="email" class="form-control"
                 [(ngModel)]="email" placeholder="you@example.com"
                 (keyup.enter)="submit()">
        </div>
      </div>

      <button class="btn btn-primary w-100 py-3 fw-semibold mb-3"
              style="border-radius:12px!important;"
              (click)="submit()" [disabled]="loading()">
        <span *ngIf="loading()" class="spinner-border spinner-border-sm me-2"></span>
        {{ loading() ? 'Sending...' : 'Send Reset Link' }}
      </button>
    }

    <p class="text-center mb-0" style="font-size:.875rem;color:#6b7280;">
      Remember your password?
      <a routerLink="/login" style="color:#6366f1;font-weight:600;text-decoration:none;">
        Sign in
      </a>
    </p>

  </div>
</div>
