<div class="auth-page">
  <div class="auth-card">

    <div class="auth-logo">
      <i class="bi bi-shield-lock-fill"></i>
    </div>

    <div class="text-center mb-4">
      <h2 class="mb-1" style="font-size:1.5rem;">Reset your password</h2>
      <p class="text-muted mb-0" style="font-size:.875rem;">Enter your new password below</p>
    </div>

    @if (success()) {
      <div class="alert p-3 mb-3"
           style="background:#f0fdf4;border:1px solid #bbf7d0;border-radius:10px;color:#065f46;font-size:.85rem;">
        <i class="bi bi-check-circle me-2"></i>{{ success() }}
      </div>
      <a routerLink="/login" class="btn btn-primary w-100 py-3 fw-semibold"
         style="border-radius:12px!important;">
        Go to Login
      </a>
    }

    @if (error() && !success()) {
      <div class="alert p-3 mb-3"
           style="background:#fef2f2;border:1px solid #fecaca;border-radius:10px;color:#991b1b;font-size:.85rem;">
        <i class="bi bi-exclamation-circle me-2"></i>{{ error() }}
      </div>
    }

    @if (!success()) {
      <div class="mb-3">
        <label class="form-label">New Password</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-lock"></i></span>
          <input type="password" class="form-control"
                 [(ngModel)]="newPassword"
                 placeholder="Min 8 chars, uppercase, lowercase, number"
                 (keyup.enter)="submit()">
        </div>
      </div>

      <div class="mb-4">
        <label class="form-label">Confirm Password</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
          <input type="password" class="form-control"
                 [(ngModel)]="confirmPassword"
                 placeholder="Repeat your new password"
                 (keyup.enter)="submit()">
        </div>
      </div>

      <button class="btn btn-primary w-100 py-3 fw-semibold"
              style="border-radius:12px!important;"
              (click)="submit()" [disabled]="loading()">
        <span *ngIf="loading()" class="spinner-border spinner-border-sm me-2"></span>
        {{ loading() ? 'Resetting...' : 'Reset Password' }}
      </button>
    }

  </div>
</div>
